# Production configuration: deploy with `npm run deploy -- -c production`.
# Set application_url and redirect_urls to the hosted app before deploying. Webhook subscriptions
# live here and not in shopify.app.toml because a localhost dev session cannot register them.
client_id = "a4108e281b2a36735a7df89a42fef412"
application_url = "https://example.com"
embedded = true
name = "TidyUp"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Products and their variants, media and metafields (write_products), costs, weights and stock
# (inventory), sales channels (publications) and the store language (read_locales).
scopes = "write_products,read_inventory,write_inventory,read_publications,write_publications,read_locales"

[webhooks]
# The same version the Admin API client uses (app/shopify.server.js).
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Product changes keep the stored scan current (app/lib/events.server.js).
  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = [ "products/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  # Subscription changes: an Early Bird seat lapses when its subscription is cancelled or expires.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app_subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  # Privacy (GDPR) webhooks, required for a public app; handled by app/routes/webhooks.compliance.jsx.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
