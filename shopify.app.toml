# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a4108e281b2a36735a7df89a42fef412"
application_url = "https://example.com"
embedded = true
name = "TidyUp"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Products and their variants, media and metafields (write_products), costs, weights and stock
# (inventory), sales channels (publications) and the store language (read_locales).
scopes = "write_products,read_inventory,write_inventory,read_publications,write_publications,read_locales"

[webhooks]
# The same version the Admin API client uses (app/shopify.server.js).
api_version = "2026-07"

  # Webhook subscriptions are in shopify.app.production.toml: a localhost dev session cannot
  # register webhook URIs, and the CLI refuses to start when it tries. Handlers: app/routes/webhooks.*.jsx.

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
